<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Booking System</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Book meeting rooms and see availability change live." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Runs before first paint so a dark-mode user never sees a light flash. The key is shared
      // with ColorModeService.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('color-mode');
        } catch (_) {}
        var mode =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-bs-theme', mode);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
