name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push makes an in-flight run of the same branch pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release

      # Testcontainers starts its own SQL Server; the runner's preinstalled Docker is all it needs.
      - run: dotnet test --no-build --configuration Release --logger 'console;verbosity=normal'

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/BookingSystem.Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/BookingSystem.Web/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # The deployed app is the API serving this bundle, so a build failure here is a deploy failure.
      - run: npm run build
