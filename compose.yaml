services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bookingsystem-sql
    # Microsoft publishes this image for amd64 only. Pinned explicitly so the platform
    # is deterministic rather than inferred; on Apple Silicon it runs under Docker
    # Desktop's Rosetta emulation, which is fast enough to be unremarkable.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Local_Dev_Password_1}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mssql-data:
